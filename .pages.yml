- name: kolory-dni
  label: Kalendarz zajęć (kolory dni)
  description: 'Kolory liczą się same: wpisz okres zajęć, dni wolne (dni rektorskie, przerwy) i zamiany dni z zarządzenia o organizacji roku. Święta ustawowe są uwzględniane
    automatycznie. Podgląd: /studia/rok-akademicki (każdy dzień tygodnia powinien wypaść 15 razy). Terminy sesji i przerw do tabeli „Rok w skrócie” — w polu Terminy
    przy semestrze.'
  type: file
  path: src/data/kolory-dni.json
  format: json
  fields:
  - name: aktualnosci
    label: Automatyczne ogłoszenia o zamianach dni
    description: 'Pola: {data} (18 grudnia 2026), {dzien_tygodnia} (piątek), {w_dniu} (w piątek), {plan_dnia} (środy), {jak_w_dniu} (jak w środę), {kolor} (niebieski).
      Wielka litera w nazwie, np. {W_dniu}, daje wielką literę w tekście. Puste pole = tekst domyślny.'
    type: object
    fields:
    - name: wlaczone
      label: Pokazuj ogłoszenia o zamianach dni
      type: boolean
      default: true
    - name: dni_robocze_przed
      label: Ile dni roboczych przed zamianą (domyślnie 5)
      type: number
      default: 5
    - name: tytul
      label: Tytuł (szablon)
      type: string
    - name: tresc
      label: Treść (szablon, Markdown)
      type: text
    - name: tytul_en
      label: 'EN: tytuł (szablon)'
      type: string
    - name: tresc_en
      label: 'EN: treść (szablon)'
      type: text
  - name: semestry
    label: Semestry
    type: object
    list: true
    fields:
    - name: nazwa
      label: Nazwa (np. Semestr zimowy 2027/28)
      type: string
      required: true
    - name: nazwa_en
      label: 'EN: nazwa'
      type: string
    - name: poczatek
      label: Pierwszy dzień zajęć
      type: date
      required: true
      options:
        format: yyyy-MM-dd
    - name: koniec
      label: Ostatni dzień zajęć
      type: date
      required: true
      options:
        format: yyyy-MM-dd
    - name: terminy
      label: Terminy do tabeli „Rok w skrócie” (zajęcia biorą się z pól powyżej)
      type: object
      fields:
      - name: semestr_od
        label: Semestr od
        type: date
        options:
          format: yyyy-MM-dd
      - name: semestr_do
        label: Semestr do
        type: date
        options:
          format: yyyy-MM-dd
      - name: inauguracja
        label: Uroczysta inauguracja roku (zwykle tylko zimą)
        type: date
        options:
          format: yyyy-MM-dd
      - name: sesja_od
        label: Sesja egzaminacyjna od
        type: date
        options:
          format: yyyy-MM-dd
      - name: sesja_do
        label: Sesja egzaminacyjna do
        type: date
        options:
          format: yyyy-MM-dd
      - name: poprawkowa_od
        label: Sesja poprawkowa od
        type: date
        options:
          format: yyyy-MM-dd
      - name: poprawkowa_do
        label: Sesja poprawkowa do
        type: date
        options:
          format: yyyy-MM-dd
      - name: przerwy
        label: Przerwa semestralna (wakacje) — jeden lub kilka okresów
        type: object
        list: true
        fields:
        - name: od
          label: Od
          type: date
          options:
            format: yyyy-MM-dd
        - name: do
          label: Do
          type: date
          options:
            format: yyyy-MM-dd
    - name: wolne
      label: Dni wolne od zajęć (święta ustawowe dodają się same)
      type: object
      list: true
      fields:
      - name: od
        label: Od
        type: date
        options:
          format: yyyy-MM-dd
      - name: do
        label: Do (puste = jeden dzień)
        type: date
        options:
          format: yyyy-MM-dd
      - name: opis
        label: Opis (np. Przerwa świąteczna)
        type: string
      - name: opis_en
        label: 'EN: opis'
        type: string
    - name: zamiany
      label: Zamiany dni (np. w piątek zajęcia środowe)
      type: object
      list: true
      fields:
      - name: data
        label: Data
        type: date
        options:
          format: yyyy-MM-dd
      - name: jak_dzien
        label: Zajęcia według planu
        type: select
        options:
          values:
          - name: pon
            label: poniedziałku
          - name: wt
            label: wtorku
          - name: sr
            label: środy
          - name: czw
            label: czwartku
          - name: pt
            label: piątku
    - name: wyjatki
      label: 'Wyjątki: ręczny kolor jednego dnia (normalnie puste)'
      type: object
      list: true
      fields:
      - name: data
        label: Data
        type: date
        options:
          format: yyyy-MM-dd
      - name: kolor
        label: Kolor
        type: select
        options:
          values:
          - name: niebieski
            label: niebieski
          - name: pomaranczowy
            label: pomarańczowy
    - name: pdf
      label: Kalendarz PDF (opcjonalnie)
      type: file
      options:
        path: public/pliki/studia/kolory-dni
    - name: uwagi
      label: Uwaga nad kalendarzem (opcjonalnie)
      type: text
    - name: uwagi_en
      label: 'EN: uwaga'
      type: text
