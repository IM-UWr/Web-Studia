        fields:
          - name: osoba
            label: Osoba
            type: reference
            required: true
            options:
              collection: katalog-pracownikow
              value: "{path}"
              label: "{imie_nazwisko}"
          - name: rola
            label: Rola (opcjonalnie)
            type: string
          - name: rola_en
            label: Rola EN
            type: string
      - name: zaklad
        label: Zakład
        type: select
        options:
          values:
            - name: algebra-i-teoria-modeli
              label: Zakład Algebry i Teorii Modeli
            - name: analiza-funkcjonalna
              label: Zakład Analizy Funkcjonalnej
            - name: analiza-matematyczna
              label: Zakład Analizy Matematycznej
            - name: dydaktyka
              label: Pracownia Dydaktyki i Popularyzacji Matematyki
            - name: geometria
              label: Zakład Geometrii
            - name: rownania-rozniczkowe
              label: Zakład Równań Różniczkowych
            - name: statystyka
              label: Zakład Statystyki
            - name: teoria-mnogosci-i-topologia
              label: Zakład Teorii Mnogości i Topologii
            - name: teoria-prawdopodobienstwa
              label: Zakład Teorii Prawdopodobieństwa
        description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
      - name: seminaria
        label: Seminaria związane ze specjalnością
        type: select
        options:
          values:
            - name: analiza-harmoniczna
              label: Analiza harmoniczna i rozwinięcia ortogonalne
            - name: dydaktyka
              label: Seminarium Pracowni Dydaktyki i Popularyzacji Matematyki
            - name: dyskretna-analiza-harmoniczna
              label: Dyskretna analiza harmoniczna i niekomutatywna probabilistyka
            - name: geometria
              label: Geometria
            - name: prawdopodobienstwo
              label: Teoria prawdopodobieństwa i modelowanie stochastyczne
            - name: rownania-rozniczkowe
              label: Równania różniczkowe
            - name: statystyka
              label: Statystyka
            - name: teoria-modeli
              label: Teoria modeli
            - name: topologia
              label: Topologia
          multiple: true
        description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
      - name: wygaszana
        label: Wygaszana
        type: boolean
      - name: bez_podstrony
        label: Bez własnej podstrony (tylko kafelek, np. specjalność wygaszana)
        type: boolean
