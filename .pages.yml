        fields:
          - name: opis
            label: Jedno zdanie pod nazwą
            type: text
          - name: opis_en
            label: "EN: zdanie pod nazwą"
            type: text
          - name: haslo
            label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
            type: string
          - name: haslo_en
            label: "EN: hasło na banerze"
            type: string
          - name: skrot
            label: Skrót (np. AD)
            type: string
          - name: poziom
            label: Poziom (np. studia I i II stopnia)
            type: string
          - name: poziom_en
            label: "EN: poziom"
            type: string
          - name: liczby
            label: Liczby w banerze
            type: object
            list: true
