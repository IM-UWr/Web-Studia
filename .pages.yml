media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
  - name: strona-dzialu
    label: Strona działu Studia
    description: "Strona /studia: tytuł i tekst „O studiach” (po polsku i po angielsku), niżej drobne pola — tekst pod tytułem, hasło i „W skrócie”. Kierunki, specjalności, kafelki (z menu „Studia”) i kontakt budują się same z danych."
    type: file
    path: src/data/studia.md
    format: yaml-frontmatter
    fields:
      - name: tytul
        label: Tytuł
        type: string
        required: true
      - name: body
        label: Treść
        description: |-
          Tekst sekcji „O studiach” (pierwszy akapit strona pokazuje większą czcionką).

          Piszesz jak w zwykłym edytorze; akapity oddziela Enter. Nagłówek 2 = nowa sekcja (pojawi się w spisie „Na tej stronie”).

          Kilka układów strona rozpoznaje sama:

          • Punkt listy zaczynający się pogrubieniem = kafelek.

          • Lista numerowana z pogrubionym początkiem = oś kroków.

          • Punkt z rolą kursywą i nazwiskiem pogrubionym = kontakt.

          • Lista samych linków = lista plików (PDF / strona).

          • Nagłówek 3 zakończony znakiem „?” = rozwijane pytanie.

          • Tekst nad listą (Seminaria, Konferencje, Aktualności…): lista stoi pod całym tekstem, chyba że jest kotwica — np. na stronie Publikacje tekst pod nagłówkiem 2 „Czasopisma redagowane w Instytucie” stoi nad listą czasopism.

          • Plik PDF: wgraj w „Media” i wklej link.

          • Akapit zaczynający się od dwuliterowego skrótu z kropką („Np.”, „Dr.”, „No.”) edytor zapisze jako listę numerowaną „1.” — zacznij akapit inaczej albo pogrub skrót.

          Więcej: ściągawka edytora (dok/sciagawka-edytora.md w Web-Core).
        type: code
        options:
          format: markdown
      - name: tytul_en
        label: Tytuł EN
        type: string
      - name: tresc_en
        label: Treść EN
        type: code
        options:
          format: markdown
        description: Tekst „O studiach” po angielsku, w tym samym układzie co Treść. Puste = strona angielska pokaże tekst polski.
      - name: wstep
        label: Wstęp pod tytułem (1–3 zdania)
        type: text
      - name: wstep_en
        label: "EN: wstęp"
        type: text
      - name: haslo
        label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
        type: string
      - name: haslo_en
        label: "EN: hasło na banerze"
        type: string
      - name: o_studiach_fakty
        label: Ramka „W skrócie” obok tekstu „O studiach” (komputer; puste = bez ramki; nie powtarzaj liczb z banera)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{wartosc} {opis}"
        fields:
          - name: wartosc
            label: Wartość (krótko, np. A+, PKA)
            type: string
          - name: wartosc_en
            label: "EN: wartość (puste = jak po polsku, np. liczby i lata)"
            type: string
          - name: opis
            label: Opis pod wartością
            type: string
          - name: opis_en
            label: "EN: opis"
            type: string
      - name: sekretariat_zakres
        label: "Kontakt: czym zajmuje się sekretariat dydaktyczny"
        hidden: true
        type: string
      - name: sekretariat_zakres_en
        label: "EN: zakres sekretariatu"
        hidden: true
        type: string
  - name: kierunki
    label: Kierunki
    description: "Cała strona kierunku w jednym formularzu: Markdown PL/EN, dane, baner. Kafelki specjalności edytuj w Markdownie kierunku, w bloku :::specjalnosci."
    type: collection
    path: src/content/kierunki
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields:
        - nazwa
      primary: nazwa
    fields:
      - name: nazwa
        label: Nazwa
        type: string
        required: true
      - name: nazwa_en
        label: Nazwa EN
        type: string
      - name: body
        label: Treść Markdown
        type: code
        options:
          format: markdown
        description: "Jawny Markdown: :::kafelki, :::etapy, :::zakladki itd. Blok kończy się :::. Komentarze objaśniają układ. Kolejność w tekście jest kolejnością na stronie. {#id} przy nagłówku zachowuje adres sekcji. Podgląd graficzny sprawdzaj w odizolowanym buildzie."
      - name: tresc_en
        label: Treść Markdown EN
        type: code
        options:
          format: markdown
        description: "Jawny Markdown: :::kafelki, :::etapy, :::zakladki itd. Blok kończy się :::. Komentarze objaśniają układ. Kolejność w tekście jest kolejnością na stronie. {#id} przy nagłówku zachowuje adres sekcji. Podgląd graficzny sprawdzaj w odizolowanym buildzie."
      - name: format_tresci
        label: Format treści
        type: string
        hidden: true
        default: jawne
      - name: opublikowany
        label: Uwzględniaj w zestawieniach
        type: boolean
        default: true
      - name: baner
        label: Baner
        type: object
        fields:
          - name: podtytul
            label: Nadtytuł (np. Studia I i II stopnia)
            type: string
          - name: opis
            label: Zdanie pod nazwą
            type: text
          - name: haslo
            label: Hasło (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
            type: string
          - name: liczby
            label: Liczby (np. 3 lata — studia I stopnia)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{wartosc} {etykieta}"
            fields:
              - name: wartosc
                label: Wartość
                type: string
              - name: etykieta
                label: Podpis
                type: string
              - name: etykieta_krotka
                label: Krótszy podpis na telefon
                type: string
              - name: wartosc_en
                label: "EN: wartość (puste = jak po polsku, np. liczby)"
                type: string
              - name: etykieta_en
                label: "EN: podpis"
                type: string
              - name: etykieta_krotka_en
                label: "EN: krótszy podpis na telefon"
                type: string
          - name: podtytul_en
            label: "EN: nadtytuł"
            type: string
          - name: opis_en
            label: "EN: zdanie pod nazwą"
            type: text
          - name: haslo_en
            label: "EN: hasło"
            type: string
  - name: specjalnosci
    label: Specjalności
    type: collection
    path: src/content/specjalnosci
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: nazwa
      fields:
        - nazwa
        - kierunek
    description: "Cała specjalność: Markdown PL/EN, powiązania i baner. Kafelki na stronie kierunku edytuje autor kierunku w jego Markdownie."
    fields:
      - name: nazwa
        label: Nazwa
        type: string
        required: true
      - name: nazwa_en
        label: Nazwa EN
        type: string
      - name: body
        label: Treść Markdown
        type: code
        options:
          format: markdown
        description: "Jawny Markdown: :::kafelki, :::etapy, :::zakladki itd. Blok kończy się :::. Komentarze objaśniają układ. Kolejność w tekście jest kolejnością na stronie. {#id} przy nagłówku zachowuje adres sekcji. Podgląd graficzny sprawdzaj w odizolowanym buildzie."
      - name: tresc_en
        label: Treść Markdown EN
