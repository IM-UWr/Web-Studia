        description: Krótki opis używany na stronie lub w jej zapowiedzi.
      - name: opis_en
        label: 'EN: opis'
        type: string
        description: Angielska wersja pola Opis (np. Przerwa świąteczna); puste oznacza użycie wersji polskiej.
      description: Dodatkowe dni wolne; świąt ustawowych nie trzeba dopisywać.
    - name: zamiany
