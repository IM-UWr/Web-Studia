# Pages CMS — Web-Studia: Studia: kierunki, strony studiów, szkoła doktorska, rok akademicki i kolory dni.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: kierunki
  label: Kierunki studiów
  description: 'Strona kierunku (np. /studia/matematyka). Pola są ułożone tak jak sekcje na stronie: ① nagłówek, ② dla kandydata, ③ dla studenta, ④ dokumenty, ⑤ kontakt,
    ⑥ wersja angielska, ⑦ menu i strona główna. Puste sekcje się nie wyświetlają. Specjalności edytuje się w sekcji „Specjalności” — kafelki na stronie kierunku budują
    się same.'
  type: collection
  path: src/content/kierunki
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - nazwa
    - kolejnosc
    primary: nazwa
  fields:
  - name: nazwa
    label: ① Nazwa kierunku
    type: string
    required: true
  - name: podtytul
    label: ① Nadtytuł (np. Studia I i II stopnia)
    type: string
  - name: opis
    label: ① Jedno zdanie pod nazwą
    type: text
  - name: fakty
    label: ① Liczby w nagłówku (np. 3 lata — studia I stopnia)
    type: object
    list: true
    fields:
    - name: wartosc
      label: Wartość
      type: string
    - name: etykieta
      label: Opis
      type: string
    - name: etykieta_en
      label: 'EN: opis'
      type: string
  - name: przyciski
    label: ① Przyciski pod opisem (np. Rekrutacja)
    type: object
    list: true
    fields:
    - name: etykieta
      label: Etykieta
      type: string
    - name: adres
      label: Adres (link)
      type: string
    - name: etykieta_en
      label: 'EN: etykieta'
      type: string
  - name: body
    label: ② O kierunku (tekst główny)
    type: rich-text
    options:
      format: markdown
  - name: dlaczego
    label: ② Dlaczego warto (kafelki)
    type: object
    list: true
    fields:
    - name: tytul
      label: Tytuł
      type: string
    - name: opis
      label: Opis
      type: text
    - name: ikona
      label: Ikona
      type: select
      options:
        values:
        - flaga
        - czapka
        - ludzie
        - zewnetrzny
        - kalendarz
        - tablica
        - zegar
        - plik
    - name: tytul_en
      label: 'EN: tytuł'
      type: string
    - name: opis_en
      label: 'EN: opis'
      type: text
  - name: kariera
    label: ② Po studiach (Markdown)
    type: text
  - name: faq
    label: ② Pytania i odpowiedzi
    type: object
    list: true
    fields:
    - name: pytanie
      label: Pytanie
      type: string
    - name: odpowiedz
      label: Odpowiedź (Markdown)
      type: text
    - name: pytanie_en
      label: 'EN: pytanie'
      type: string
    - name: odpowiedz_en
      label: 'EN: odpowiedź'
      type: text
  - name: etapy
    label: ③ Jak wyglądają studia — oś semestrów (co roku sprawdź z nowym programem)
    description: Każdy etap to jeden punkt na osi. Stopień I i II pokazują się jako dwie ścieżki, III — jako ścieżka doktoranta.
    type: object
    list: true
    fields:
    - name: stopien
      label: Stopień
      type: select
      options:
        values:
        - I
        - II
        - III
    - name: kiedy
      label: Kiedy (np. Semestry 1–2)
      type: string
    - name: tytul
      label: Tytuł etapu
      type: string
    - name: opis
      label: Opis
      type: text
    - name: termin
      label: Ważny termin (opcjonalnie)
      type: string
    - name: formularz
      label: Formularz (np. Formularz C2)
      type: string
    - name: formularz_adres
      label: Link do formularza
      type: string
    - name: kiedy_en
      label: 'EN: kiedy'
      type: string
    - name: tytul_en
      label: 'EN: tytuł'
      type: string
    - name: opis_en
      label: 'EN: opis'
      type: text
    - name: termin_en
      label: 'EN: termin'
      type: string
  - name: programy
    label: ③ Programy studiów (zakładki; nowy program = nowa pozycja z rokiem „od”)
    description: Student wybiera rok rozpoczęcia studiów i widzi program, którego zakres lat go obejmuje. Przy nowym programie dodaj pozycję, a staremu wpisz „do
      roku”.
    type: object
    list: true
    fields:
    - name: nazwa
      label: Nazwa zakładki (np. Nowy program od 2026/27)
      type: string
    - name: dotyczy
      label: Kogo dotyczy
      type: string
    - name: od_roku
      label: Dla rozpoczynających studia od roku (np. 2026)
      type: number
    - name: do_roku
      label: … do roku (puste = bez końca)
      type: number
    - name: dokumenty
      label: Dokumenty
      type: object
      list: true
      fields:
      - name: nazwa
        label: Nazwa
        type: string
      - name: wgraj
        label: Wgraj plik (PDF, DOCX…)
        type: file
        options:
          path: public/pliki/studia
      - name: plik
        label: …albo link (np. do BIP) — gdy nie wgrywasz pliku
        type: string
      - name: opis
        label: Krótki opis (opcjonalnie)
        type: string
      - name: nazwa_en
        label: 'EN: nazwa'
        type: string
      - name: opis_en
        label: 'EN: krótki opis'
        type: string
    - name: nazwa_en
      label: 'EN: nazwa zakładki'
      type: string
    - name: dotyczy_en
      label: 'EN: kogo dotyczy'
      type: string
  - name: terminy
    label: ③ Terminy i formularze (tabela)
    type: object
    list: true
    fields:
    - name: co
      label: Sprawa
      type: string
    - name: kogo
      label: Kogo dotyczy
      type: string
    - name: termin
      label: Termin
      type: string
    - name: formularz
      label: Formularz (np. C2)
      type: string
    - name: formularz_adres
      label: Link do formularza
      type: string
    - name: przypomnienie
      label: Przypomnienie w „Najbliższych wydarzeniach” (strona główna, aktualności)
      type: boolean
      default: false
    - name: data
      label: Data terminu (do kiedy) — potrzebna do przypomnienia
      type: date
      options:
        format: yyyy-MM-dd
    - name: dni_przed
      label: Ile dni przed terminem pokazać przypomnienie (domyślnie 14)
      type: number
      default: 14
    - name: co_roku
      label: Powtarza się co roku (ten sam dzień i miesiąc)
      type: boolean
      default: true
    - name: co_en
      label: 'EN: sprawa'
      type: string
    - name: kogo_en
      label: 'EN: kogo dotyczy'
      type: string
    - name: termin_en
      label: 'EN: termin'
      type: string
  - name: praktyki
    label: ③ Praktyki pedagogiczne (Markdown; puste = sekcja ukryta)
    type: text
  - name: praktyki_dokumenty
    label: ④ Dokumenty praktyk
    type: object
    list: true
    fields:
    - name: nazwa
      label: Nazwa
      type: string
    - name: wgraj
      label: Wgraj plik (PDF, DOCX…)
      type: file
      options:
        path: public/pliki/studia
    - name: plik
      label: …albo link — gdy nie wgrywasz pliku
      type: string
    - name: nazwa_en
      label: 'EN: nazwa'
      type: string
  - name: akty
    label: ④ Akty prawne (regulaminy, uchwały, zarządzenia)
    type: object
    list: true
    fields:
    - name: nazwa
      label: Nazwa
      type: string
    - name: wgraj
      label: Wgraj plik (PDF)
      type: file
      options:
        path: public/pliki/studia
    - name: plik
      label: …albo link (np. do BIP) — gdy nie wgrywasz pliku
      type: string
    - name: nazwa_en
      label: 'EN: nazwa'
      type: string
  - name: kontakt
    label: ⑤ Kontakt
    type: object
    list: true
    fields:
    - name: rola
      label: Rola (np. Sekretariat dydaktyczny)
      type: string
    - name: osoba
      label: Osoba
      type: string
    - name: email
      label: E-mail
      type: string
    - name: telefon
      label: Telefon (tylko sekretariat, dziekanat, administracja)
      type: string
    - name: pokoj
      label: Pokój
      type: string
    - name: rola_en
      label: 'EN: rola'
      type: string
  - name: nazwa_en
    label: '⑥ EN: nazwa kierunku'
    type: string
  - name: podtytul_en
    label: '⑥ EN: nadtytuł'
    type: string
  - name: opis_en
    label: '⑥ EN: zdanie pod nazwą'
    type: text
  - name: tresc_en
    label: '⑥ EN: o kierunku (Markdown)'
    type: text
  - name: praktyki_en
    label: '⑥ EN: praktyki (Markdown)'
    type: text
  - name: kariera_en
    label: '⑥ EN: po studiach (Markdown)'
    type: text
  - name: kolejnosc
    label: ⑦ Kolejność (w menu „Studia” i w kafelkach na stronie głównej; 1 = pierwszy)
    type: number
  - name: w_menu
    label: ⑦ Pokaż w menu „Studia”
    type: boolean
    default: true
  - name: menu_etykieta
    label: ⑦ Krótka nazwa w menu i na kafelku (puste = pełna nazwa)
    type: string
  - name: menu_etykieta_en
    label: '⑦ EN: krótka nazwa'
    type: string
  - name: na_stronie_glownej
    label: ⑦ Pokaż kafelek na stronie głównej (sekcja Studia)
    type: boolean
    default: true
  - name: kafelek_poziom
    label: '⑦ Kafelek: napis nad nazwą (np. Kierunek, III stopień)'
    type: string
  - name: kafelek_poziom_en
    label: '⑦ EN: napis nad nazwą'
    type: string
  - name: kafelek_opis
    label: '⑦ Kafelek: jedno krótkie zdanie (puste = zdanie spod nazwy)'
    type: string
  - name: kafelek_opis_en
    label: '⑦ EN: zdanie na kafelku'
    type: string
- name: strony
  label: Strony studiów
  description: Adres strony = ścieżka pliku, np. studia/matematyka.md → /studia/matematyka
  type: collection
  path: src/content/strony/studia
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: opis
    label: Krótki opis (pod tytułem i w Google)
    type: text
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: body
    label: Treść
    type: rich-text
    options:
      format: markdown
      path: public/pliki/studia
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: tresc_en
    label: 'EN: treść (Markdown)'
    type: text
- name: rok-akademicki
  label: Rok akademicki — tekst strony
  description: Kolory, terminy semestru, dni wolne i zamiany dni wpisuje się w „Kalendarz zajęć (kolory dni)”; tu tylko tekst.
  type: file
  path: src/data/rok-akademicki.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: opis
    label: Krótki opis
    type: text
  - name: body
    label: Tekst wspólny pod tabelą „Rok w skrócie” (bez dat semestru)
    type: rich-text
    options:
      format: markdown
      path: public/pliki/studia
  - name: dalej
    label: Koniec strony (linki, podstawa prawna)
    type: rich-text
    options:
      format: markdown
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: tresc_en
    label: 'EN: treść (Markdown)'
    type: text
  - name: dalej_en
    label: 'EN: koniec strony (Markdown)'
    type: text
- name: kolory-dni
  label: Kalendarz zajęć (kolory dni)
  description: 'Kolory liczą się same: wpisz okres zajęć, dni wolne (dni rektorskie, przerwy) i zamiany dni z zarządzenia o organizacji roku. Święta ustawowe są uwzględniane
    automatycznie. Podgląd: /studia/rok-akademicki (każdy dzień tygodnia powinien wypaść 15 razy). Terminy sesji i przerw do tabeli „Rok w skrócie” — w polu Terminy
    przy semestrze.'
  type: file
  path: src/data/kolory-dni.json
  format: json
  fields:
  - name: aktualnosci
    label: Automatyczne ogłoszenia o zamianach dni
    description: 'Pola: {data} (18 grudnia 2026), {dzien_tygodnia} (piątek), {w_dniu} (w piątek), {plan_dnia} (środy), {jak_w_dniu} (jak w środę), {kolor} (niebieski).
      Wielka litera w nazwie, np. {W_dniu}, daje wielką literę w tekście. Puste pole = tekst domyślny.'
    type: object
    fields:
    - name: wlaczone
      label: Pokazuj ogłoszenia o zamianach dni
      type: boolean
      default: true
    - name: dni_robocze_przed
      label: Ile dni roboczych przed zamianą (domyślnie 5)
      type: number
      default: 5
    - name: tytul
      label: Tytuł (szablon)
      type: string
    - name: tresc
      label: Treść (szablon, Markdown)
      type: text
    - name: tytul_en
      label: 'EN: tytuł (szablon)'
      type: string
    - name: tresc_en
      label: 'EN: treść (szablon)'
      type: text
  - name: semestry
    label: Semestry
    type: object
    list: true
    fields:
    - name: nazwa
      label: Nazwa (np. Semestr zimowy 2027/28)
      type: string
      required: true
    - name: nazwa_en
      label: 'EN: nazwa'
      type: string
    - name: poczatek
      label: Pierwszy dzień zajęć
      type: date
      required: true
      options:
        format: yyyy-MM-dd
    - name: koniec
      label: Ostatni dzień zajęć
      type: date
      required: true
      options:
        format: yyyy-MM-dd
    - name: terminy
      label: Terminy do tabeli „Rok w skrócie” (zajęcia biorą się z pól powyżej)
      type: object
      fields:
      - name: semestr_od
        label: Semestr od
        type: date
        options:
          format: yyyy-MM-dd
      - name: semestr_do
        label: Semestr do
        type: date
        options:
          format: yyyy-MM-dd
      - name: inauguracja
        label: Uroczysta inauguracja roku (zwykle tylko zimą)
        type: date
        options:
          format: yyyy-MM-dd
      - name: sesja_od
        label: Sesja egzaminacyjna od
        type: date
        options:
          format: yyyy-MM-dd
      - name: sesja_do
        label: Sesja egzaminacyjna do
        type: date
        options:
          format: yyyy-MM-dd
      - name: poprawkowa_od
        label: Sesja poprawkowa od
        type: date
        options:
          format: yyyy-MM-dd
      - name: poprawkowa_do
        label: Sesja poprawkowa do
        type: date
        options:
          format: yyyy-MM-dd
      - name: przerwy
        label: Przerwa semestralna (wakacje) — jeden lub kilka okresów
        type: object
        list: true
        fields:
        - name: od
          label: Od
          type: date
          options:
            format: yyyy-MM-dd
        - name: do
          label: Do
          type: date
          options:
            format: yyyy-MM-dd
    - name: wolne
      label: Dni wolne od zajęć (święta ustawowe dodają się same)
      type: object
      list: true
      fields:
      - name: od
        label: Od
        type: date
        options:
          format: yyyy-MM-dd
      - name: do
        label: Do (puste = jeden dzień)
        type: date
        options:
          format: yyyy-MM-dd
      - name: opis
        label: Opis (np. Przerwa świąteczna)
        type: string
      - name: opis_en
        label: 'EN: opis'
        type: string
    - name: zamiany
      label: Zamiany dni (np. w piątek zajęcia środowe)
      type: object
      list: true
      fields:
      - name: data
        label: Data
        type: date
        options:
          format: yyyy-MM-dd
      - name: jak_dzien
        label: Zajęcia według planu
        type: select
        options:
          values:
          - name: pon
            label: poniedziałku
          - name: wt
            label: wtorku
          - name: sr
            label: środy
          - name: czw
            label: czwartku
          - name: pt
            label: piątku
    - name: wyjatki
      label: 'Wyjątki: ręczny kolor jednego dnia (normalnie puste)'
      type: object
      list: true
      fields:
      - name: data
        label: Data
        type: date
        options:
          format: yyyy-MM-dd
      - name: kolor
        label: Kolor
        type: select
        options:
          values:
          - name: niebieski
            label: niebieski
          - name: pomaranczowy
            label: pomarańczowy
    - name: pdf
      label: Kalendarz PDF (opcjonalnie)
      type: file
      options:
        path: public/pliki/studia/kolory-dni
    - name: uwagi
      label: Uwaga nad kalendarzem (opcjonalnie)
      type: text
    - name: uwagi_en
      label: 'EN: uwaga'
      type: text
- name: spec-matematyka-w-ekonomii
  label: 'Specjalność wygaszana: Matematyka w ekonomii'
  type: file
  path: src/content/specjalnosci/matematyka-w-ekonomii.md
  format: yaml-frontmatter
  fields:
  - name: nazwa
    label: Nazwa specjalności
    type: string
    required: true
  - name: kierunek
    label: Kierunek
    type: reference
    options:
      collection: kierunki
      value: '{path}'
      label: '{primary}'
      search: nazwa
  - name: kolejnosc
    label: Kolejność kafelka na stronie kierunku (1 = pierwszy)
    type: number
  - name: na_stronie_kierunku
    label: Pokaż kafelek na stronie kierunku
    type: boolean
    default: true
  - name: bez_podstrony
    label: Bez własnej podstrony (tylko kafelek, np. specjalność wygaszana)
    type: boolean
    default: false
  - name: kafelek_dla_kogo
    label: 'Kafelek: „Dla kogo” — jedno zdanie'
    type: text
  - name: kafelek_kariera
    label: 'Kafelek: „Po studiach” — jedno zdanie'
    type: text
  - name: skrot
    label: Skrót (np. AD)
    type: string
  - name: poziom
    label: Poziom (np. studia I i II stopnia)
    type: string
  - name: opis
    label: Jedno zdanie pod nazwą
    type: text
  - name: zaklad
    label: Zakład
    type: select
    options:
      values:
      - name: algebra-i-teoria-modeli
        label: Zakład Algebry i Teorii Modeli
      - name: analiza-funkcjonalna
        label: Zakład Analizy Funkcjonalnej
      - name: analiza-matematyczna
        label: Zakład Analizy Matematycznej
      - name: dydaktyka
        label: Pracownia Dydaktyki i Popularyzacji Matematyki
      - name: geometria
        label: Zakład Geometrii
      - name: rownania-rozniczkowe
        label: Zakład Równań Różniczkowych
      - name: statystyka
        label: Zakład Statystyki
      - name: teoria-mnogosci-i-topologia
        label: Zakład Teorii Mnogości i Topologii
      - name: teoria-prawdopodobienstwa
        label: Zakład Teorii Prawdopodobieństwa
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
  - name: opiekunowie
    label: Opiekunowie (imię i nazwisko jak w spisie pracowników, bez tytułów)
    type: object
    list: true
    fields:
    - name: imie_nazwisko
      label: Imię i nazwisko
      type: string
    - name: rola
      label: Rola (opcjonalnie)
      type: string
  - name: wygaszana
    label: Wygaszana
    type: boolean
  - name: body
    label: O specjalności
    type: rich-text
    options:
      format: markdown
  - name: dla_kogo
    label: Dla kogo (Markdown)
    type: text
  - name: dlaczego
    label: Co wyróżnia specjalność (kafelki)
    type: object
    list: true
    fields:
    - name: tytul
      label: Tytuł
      type: string
    - name: opis
      label: Opis
      type: text
    - name: ikona
      label: Ikona
      type: select
      options:
        values:
