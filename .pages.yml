# Pages CMS — Web-Studia: Studia: kierunki (treść, baner), przypomnienia o terminach, strony studiów, szkoła doktorska, rok akademicki i kolory dni.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: kierunki-grupa
  label: Kierunki
  description: 'Strony kierunków (np. /studia/matematyka) i szkoły doktorskiej. Treść kierunku to jeden tekst (PL i EN); baner osobno. Kolejność i napisy w menu „Studia” i na kafelkach strony głównej: Ustawienia → Sekcja „Studiuj matematykę”. Specjalności edytuje się w sekcji „Specjalności” — kafelki na stronie kierunku budują się same.'
  type: group
  items:
  - name: kierunki
    label: Treść
    description: 'Jeden plik = jedna strona kierunku. Nowy kierunek pojawi się sam w menu „Studia” i w kafelkach strony głównej (na końcu; miejsce i napisy ustawisz w Ustawieniach).'
    type: collection
    path: src/content/kierunki
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      fields:
      - nazwa
      primary: nazwa
    fields:
    - name: nazwa
      label: Nazwa
      type: string
      required: true
    - name: body
      label: Treść
      description: |-
        Piszesz jak w zwykłym edytorze. Kilka układów strona rozpoznaje sama:
        • Nagłówek 2 = nowa sekcja (pojawi się w spisie „Na tej stronie”).
        • Punkt listy zaczynający się pogrubieniem = kafelek (np. „Dlaczego warto”).
        • Lista numerowana z pogrubionym początkiem = oś kroków. W pogrubieniu tekst przed dwukropkiem to mała etykieta: „Semestry 1–2: Podstawy”.
        • W punkcie linia „Termin: …” albo „Formularz: …” = para; sam link w linii = przycisk. Kolejną linię w tym samym punkcie dodasz Shift+Enter (zwykły Enter też zadziała).
        • Nagłówek 3 zakończony znakiem „?” = rozwijane pytanie.
        • Lista samych linków = lista plików (PDF / strona).
        • Punkt z rolą kursywą i nazwiskiem pogrubionym = kontakt.
        • Pod nagłówkiem „Specjalności” strona sama wstawi kafelki specjalności; pod „Program studiów” nagłówki 3 stają się zakładkami.
        • Plik PDF: wgraj w „Media” i wklej link.
      type: rich-text
      options:
        format: markdown
        path: public/pliki/studia
    - name: nazwa_en
      label: Nazwa EN
      type: string
    - name: tresc_en
      label: Treść EN
      description: 'Cała strona po angielsku, w tym samym układzie co Treść (nagłówki sekcji po angielsku, np. About, Why join, FAQ). Puste = strona angielska pokaże treść polską.'
      type: rich-text
      options:
        format: markdown
        path: public/pliki/studia
  - name: kierunki-baner
    label: Baner
    description: 'Nagłówek strony kierunku: nadtytuł, zdanie pod nazwą, hasło i liczby. Jeden plik na kierunek; nazwa pliku = nazwa pliku treści kierunku (np. matematyka). Kierunek bez banera ma w nagłówku samą nazwę.'
    type: collection
    path: src/content/kierunki-baner
    format: json
    filename: '{fields.kierunek}.json'
    view:
      fields:
      - kierunek
      - podtytul
      primary: kierunek
    fields:
    - name: kierunek
      label: Kierunek (nazwa pliku treści, np. matematyka, isim, siad, szkola-doktorska)
      type: string
      required: true
    - name: podtytul
      label: Nadtytuł (np. Studia I i II stopnia)
      type: string
    - name: opis
      label: Zdanie pod nazwą
      type: text
    - name: haslo
      label: Hasło (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
      type: string
    - name: liczby
      label: Liczby (np. 3 lata — studia I stopnia)
      type: object
      list: true
      fields:
      - name: wartosc
        label: Wartość
        type: string
      - name: etykieta
        label: Podpis
        type: string
      - name: etykieta_krotka
        label: Krótszy podpis na telefon
        type: string
      - name: wartosc_en
        label: 'EN: wartość (puste = jak po polsku, np. liczby)'
        type: string
      - name: etykieta_en
        label: 'EN: podpis'
        type: string
      - name: etykieta_krotka_en
        label: 'EN: krótszy podpis na telefon'
        type: string
    - name: podtytul_en
      label: 'EN: nadtytuł'
      type: string
    - name: opis_en
      label: 'EN: zdanie pod nazwą'
      type: text
    - name: haslo_en
      label: 'EN: hasło'
      type: string
- name: przypomnienia
  label: Przypomnienia o terminach
  description: 'Terminy, które strona główna (Najbliższe wydarzenia) pokazuje kilka dni wcześniej, np. deklaracja specjalności. Po kliknięciu: link (zwykle tabela terminów na stronie kierunku).'
  type: file
  path: src/data/przypomnienia.json
  format: json
  fields:
  - name: przypomnienia
    label: Przypomnienia
    type: object
    list: true
    fields:
    - name: sprawa
      label: Sprawa (np. Deklaracja specjalności (I stopień))
      type: string
      required: true
    - name: podpis
      label: Podpis pod sprawą (np. 4. semestr studiów I stopnia · formularz C2)
      type: string
    - name: data
      label: Data
      type: date
      required: true
      options:
        format: yyyy-MM-dd
    - name: co_roku
      label: Co roku (rok w dacie nie ma znaczenia)
      type: boolean
      default: true
    - name: dni_przed
      label: Ile dni wcześniej pokazać
      type: number
      default: 14
    - name: adres
      label: Link (np. /studia/matematyka#terminy)
      type: string
    - name: sprawa_en
      label: 'EN: sprawa'
      type: string
    - name: podpis_en
      label: 'EN: podpis'
      type: string
    - name: uid
      label: Identyfikator w kalendarzach (techniczne, nie zmieniać)
      type: string
      hidden: true
- name: strony
  label: Strony studiów
  description: Adres strony = ścieżka pliku, np. studia/matematyka.md → /studia/matematyka
  type: collection
  path: src/content/strony/studia
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: opis
    label: Krótki opis (pod tytułem i w Google)
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: liczby
    label: Liczby pod hasłem na banerze (tylko gdy nie da się ich policzyć z danych)
    type: object
    list: true
    fields:
    - name: n
      label: Liczba (np. 8 albo 3 lata)
      type: string
      required: true
    - name: n_en
      label: 'EN: liczba (puste = jak po polsku)'
      type: string
    - name: etykieta
      label: Podpis
      type: string
      required: true
    - name: etykieta_en
      label: 'EN: podpis'
      type: string
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: body
    label: Treść
    type: rich-text
    options:
      format: markdown
      path: public/pliki/studia
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: tresc_en
    label: 'EN: treść (Markdown)'
    type: text
