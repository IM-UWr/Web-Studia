      label: Pierwszy dzień zajęć
      type: date
      required: true
      options:
        format: yyyy-MM-dd
      description: Pierwszy dzień konferencji lub zajęć.
    - name: koniec
      label: Ostatni dzień zajęć
      type: date
      required: true
      options:
        format: yyyy-MM-dd
      description: Ostatni dzień; puste przy konferencji oznacza jeden dzień.
