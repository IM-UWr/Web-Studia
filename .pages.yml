        description: "Jawny Markdown: :::kafelki, :::etapy, :::zakladki itd. Blok kończy się :::. Komentarze objaśniają układ. Kolejność w tekście jest kolejnością na stronie. {#id} przy nagłówku zachowuje adres sekcji. Podgląd graficzny sprawdzaj w odizolowanym buildzie."
      - name: format_tresci
