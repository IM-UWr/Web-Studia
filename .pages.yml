# Pages CMS — Web-Studia: Studia: kierunki (treść, baner), przypomnienia o terminach, strony studiów, szkoła doktorska, rok akademicki i kolory dni.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: strona-dzialu
  label: Strona działu Studia
  description: 'Strona /studia: tytuł i tekst „O studiach” (po polsku i po angielsku), niżej drobne pola — tekst pod tytułem, hasło i „W skrócie”. Kierunki, specjalności, kafelki (z menu „Studia”) i kontakt budują się same z danych.'
  type: file
  path: src/data/studia.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: body
    label: Treść
    description: |-
      Tekst sekcji „O studiach” (pierwszy akapit strona pokazuje większą czcionką).

      Piszesz jak w zwykłym edytorze; akapity oddziela Enter. Nagłówek 2 = nowa sekcja (pojawi się w spisie „Na tej stronie”).

      Kilka układów strona rozpoznaje sama:

      • Punkt listy zaczynający się pogrubieniem = kafelek.

      • Lista numerowana z pogrubionym początkiem = oś kroków.

      • Punkt z rolą kursywą i nazwiskiem pogrubionym = kontakt.

      • Lista samych linków = lista plików (PDF / strona).

      • Nagłówek 3 zakończony znakiem „?” = rozwijane pytanie.

      • Tekst nad listą (Seminaria, Konferencje, Aktualności…): lista stoi pod całym tekstem, chyba że jest kotwica — np. na stronie Publikacje tekst pod nagłówkiem 2 „Czasopisma redagowane w Instytucie” stoi nad listą czasopism.

      • Plik PDF: wgraj w „Media” i wklej link.

      • Akapit zaczynający się od dwuliterowego skrótu z kropką („Np.”, „Dr.”, „No.”) edytor zapisze jako listę numerowaną „1.” — zacznij akapit inaczej albo pogrub skrót.

      Więcej: ściągawka edytora (dok/sciagawka-edytora.md w Web-Core).
    type: rich-text
    options:
      format: markdown
      path: public/pliki/studia
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: tresc_en
    label: Treść EN
    type: rich-text
    options:
      format: markdown
      path: public/pliki/studia
    description: Tekst „O studiach” po angielsku, w tym samym układzie co Treść. Puste = strona angielska pokaże tekst polski.
  - name: wstep
    label: Wstęp pod tytułem (1–3 zdania)
    type: text
  - name: wstep_en
    label: 'EN: wstęp'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: o_studiach_fakty
    label: Ramka „W skrócie” obok tekstu „O studiach” (komputer; puste = bez ramki; nie powtarzaj liczb z banera)
    type: object
    list: true
    fields:
    - name: wartosc
      label: Wartość (krótko, np. A+, PKA)
      type: string
    - name: wartosc_en
      label: 'EN: wartość (puste = jak po polsku, np. liczby i lata)'
      type: string
    - name: opis
      label: Opis pod wartością
      type: string
    - name: opis_en
      label: 'EN: opis'
      type: string
  - name: sekretariat_zakres
    label: 'Kontakt: czym zajmuje się sekretariat dydaktyczny'
    hidden: true
    type: string
  - name: sekretariat_zakres_en
    label: 'EN: zakres sekretariatu'
    hidden: true
    type: string
- name: kierunki-grupa
  label: Kierunki
  description: 'Strony kierunków (np. /studia/matematyka) i szkoły doktorskiej. Treść kierunku to jeden tekst (PL i EN); baner osobno. Kolejność i napisy w menu „Studia” i na kafelkach strony głównej: Ustawienia → Sekcja „Studiuj matematykę”. Specjalności edytuje się w repozytoriach Web-Spec-* (formularze „Treść” oraz „Baner i kafelek”; wygaszana Matematyka w ekonomii — tu, na końcu listy) — kafelki na stronie kierunku budują się same.'
  type: group
  items:
  - name: kierunki
    label: Treść
    description: Jeden plik = jedna strona kierunku. Nowy kierunek pojawi się sam w menu „Studia” i w kafelkach strony głównej (na końcu; miejsce i napisy ustawisz w Ustawieniach).
    type: collection
    path: src/content/kierunki
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      fields:
      - nazwa
      primary: nazwa
    fields:
    - name: nazwa
      label: Nazwa
      type: string
      required: true
    - name: body
      label: Treść
      description: |-
        Piszesz jak w zwykłym edytorze. Kilka układów strona rozpoznaje sama:
        • Nagłówek 2 = nowa sekcja (pojawi się w spisie „Na tej stronie”).
        • Punkt listy zaczynający się pogrubieniem = kafelek (np. „Dlaczego warto”).
        • Lista numerowana z pogrubionym początkiem = oś kroków. W pogrubieniu tekst przed dwukropkiem to mała etykieta: „Semestry 1–2: Podstawy”.
        • W punkcie linia „Termin: …” albo „Formularz: …” = para; sam link w linii = przycisk. Kolejną linię w tym samym punkcie dodasz Shift+Enter (zwykły Enter też zadziała).
        • Nagłówek 3 zakończony znakiem „?” = rozwijane pytanie.
        • Lista samych linków = lista plików (PDF / strona).
        • Punkt z rolą kursywą i nazwiskiem pogrubionym = kontakt.
        • Pod nagłówkiem „Specjalności” strona sama wstawi kafelki specjalności; pod „Program studiów” nagłówki 3 stają się zakładkami.
        • Plik PDF: wgraj w „Media” i wklej link.
        • Akapit zaczynający się od dwuliterowego skrótu z kropką („Np.”, „Dr.”, „No.”) edytor zapisze jako listę numerowaną „1.” — zacznij akapit inaczej albo pogrub skrót.
      type: rich-text
      options:
        format: markdown
        path: public/pliki/studia
    - name: nazwa_en
      label: Nazwa EN
      type: string
    - name: tresc_en
      label: Treść EN
      description: Cała strona po angielsku, w tym samym układzie co Treść (nagłówki sekcji po angielsku, np. About, Why join, FAQ). Puste = strona angielska pokaże treść polską.
      type: rich-text
      options:
        format: markdown
        path: public/pliki/studia
  - name: kierunki-baner
    label: Baner
    description: 'Nagłówek strony kierunku: nadtytuł, zdanie pod nazwą, hasło i liczby. Jeden plik na kierunek; nazwa pliku = nazwa pliku treści kierunku (np. matematyka). Kierunek bez banera ma w nagłówku samą nazwę.'
    type: collection
    path: src/content/kierunki-baner
    format: json
    filename: '{fields.kierunek}.json'
    view:
