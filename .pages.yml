      - name: tytul
        label: Tytuł
        type: string
        required: true
      - name: body
        label: Tekst wspólny pod tabelą „Rok w skrócie” (bez dat semestru)
        type: code
        options:
          format: markdown
        description: |-
          Tekst wspólny pod tabelą „Rok w skrócie” (bez dat semestru); między Treścią a Końcem strony strona wstawia kalendarz.

          Piszesz jak w zwykłym edytorze; akapity oddziela Enter. Nagłówek 2 = nowa sekcja (pojawi się w spisie „Na tej stronie”).

          Gdy włączone jest pole „Bloki” (niżej), kilka układów strona rozpoznaje sama:

          • Punkt listy zaczynający się pogrubieniem = kafelek.

          • Lista numerowana z pogrubionym początkiem = oś kroków.

          • Punkt z rolą kursywą i nazwiskiem pogrubionym = kontakt.

          • Lista samych linków = lista plików (PDF / strona).

          • Nagłówek 3 zakończony znakiem „?” = rozwijane pytanie.

          • Tekst nad listą (Seminaria, Konferencje, Aktualności…): lista stoi pod całym tekstem, chyba że jest kotwica — np. na stronie Publikacje tekst pod nagłówkiem 2 „Czasopisma redagowane w Instytucie” stoi nad listą czasopism.

          • Plik PDF: wgraj w „Media” i wklej link.

          • Akapit zaczynający się od dwuliterowego skrótu z kropką („Np.”, „Dr.”, „No.”) edytor zapisze jako listę numerowaną „1.” — zacznij akapit inaczej albo pogrub skrót.

          Więcej: ściągawka edytora (dok/sciagawka-edytora.md w Web-Core).
      - name: tytul_en
        label: Tytuł EN
        type: string
      - name: tresc_en
        label: Treść EN
        description: Cała strona po angielsku, w tym samym układzie co Treść (nagłówki sekcji po angielsku). Puste = strona angielska pokaże treść polską.
        type: code
        options:
          format: markdown
      - name: dalej
        label: Koniec strony (linki, podstawa prawna)
        type: code
        options:
          format: markdown
      - name: dalej_en
        label: Koniec strony EN
        description: Koniec strony po angielsku, w tym samym układzie. Puste = strona angielska pokaże tekst polski.
        type: code
        options:
          format: markdown
      - name: opis
        label: Krótki opis
        type: text
      - name: opis_en
        label: "EN: opis"
        type: text
      - name: haslo
        label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
        type: string
      - name: haslo_en
        label: "EN: hasło na banerze"
        type: string
      - name: bloki
        label: Kafelki, oś i kontakty z list — zob. ściągawka
        type: boolean
        default: false
        description: "Włączone: listy w treści stają się blokami (kafelki, oś kroków, kontakty, lista plików, rozwijane pytania) — opis przy polu „Treść”. Wyłączone: zwykłe listy."
  - name: kolory-dni
    label: Kalendarz zajęć (kolory dni)
    description: "Kolory liczą się same: wpisz okres zajęć, dni wolne (dni rektorskie, przerwy) i zamiany dni z zarządzenia o organizacji roku. Święta ustawowe są uwzględniane automatycznie. Podgląd: /studia/rok-akademicki (każdy dzień tygodnia powinien wypaść 15 razy). Terminy sesji i przerw do tabeli „Rok w skrócie” — w polu Terminy przy semestrze."
    type: file
    path: src/data/kolory-dni.json
    format: json
    fields:
      - name: aktualnosci
        label: Automatyczne ogłoszenia o zamianach dni
        description: "Pola: {data} (18 grudnia 2026), {dzien_tygodnia} (piątek), {w_dniu} (w piątek), {plan_dnia} (środy), {jak_w_dniu} (jak w środę), {kolor} (niebieski). Wielka litera w nazwie, np. {W_dniu}, daje wielką literę w tekście. Puste pole = tekst domyślny."
        type: object
        fields:
          - name: wlaczone
            label: Pokazuj ogłoszenia o zamianach dni
            type: boolean
            default: true
          - name: dni_robocze_przed
            label: Ile dni roboczych przed zamianą (domyślnie 5)
            type: number
            default: 5
          - name: tytul
            label: Tytuł (szablon)
            type: string
          - name: tresc
            label: Treść (szablon, Markdown)
            type: code
            options:
              format: markdown
          - name: tytul_en
            label: "EN: tytuł (szablon)"
            type: string
          - name: tresc_en
            label: "EN: treść (szablon)"
            type: code
            options:
              format: markdown
      - name: semestry
        label: Semestry
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nazwa}"
        fields:
          - name: nazwa
            label: Nazwa (np. Semestr zimowy 2027/28)
            type: string
            required: true
          - name: nazwa_en
            label: "EN: nazwa"
            type: string
          - name: poczatek
            label: Pierwszy dzień zajęć
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: koniec
            label: Ostatni dzień zajęć
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: terminy
            label: Terminy do tabeli „Rok w skrócie” (zajęcia biorą się z pól powyżej)
            type: object
            fields:
              - name: semestr_od
                label: Semestr od
                type: date
                options:
                  format: yyyy-MM-dd
              - name: semestr_do
                label: Semestr do
                type: date
                options:
                  format: yyyy-MM-dd
              - name: inauguracja
                label: Uroczysta inauguracja roku (zwykle tylko zimą)
                type: date
                options:
                  format: yyyy-MM-dd
              - name: sesja_od
                label: Sesja egzaminacyjna od
                type: date
                options:
                  format: yyyy-MM-dd
              - name: sesja_do
                label: Sesja egzaminacyjna do
                type: date
                options:
                  format: yyyy-MM-dd
              - name: poprawkowa_od
                label: Sesja poprawkowa od
                type: date
                options:
                  format: yyyy-MM-dd
              - name: poprawkowa_do
                label: Sesja poprawkowa do
                type: date
                options:
                  format: yyyy-MM-dd
              - name: przerwy
                label: Przerwa semestralna (wakacje) — jeden lub kilka okresów
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{od} – {do}"
                fields:
                  - name: od
                    label: Od
                    type: date
                    options:
                      format: yyyy-MM-dd
                  - name: do
                    label: Do
                    type: date
                    options:
                      format: yyyy-MM-dd
          - name: wolne
            label: Dni wolne od zajęć (święta ustawowe dodają się same)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{od} {opis}"
            fields:
              - name: od
                label: Od
                type: date
                options:
                  format: yyyy-MM-dd
              - name: do
                label: Do (puste = jeden dzień)
                type: date
                options:
                  format: yyyy-MM-dd
              - name: opis
                label: Opis (np. Przerwa świąteczna)
                type: string
              - name: opis_en
                label: "EN: opis"
                type: string
          - name: zamiany
            label: Zamiany dni (np. w piątek zajęcia środowe)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{data} {jak_dzien}"
            fields:
              - name: data
                label: Data
                type: date
                options:
                  format: yyyy-MM-dd
              - name: jak_dzien
                label: Zajęcia według planu
                type: select
                options:
                  values:
                    - name: pon
                      label: poniedziałku
                    - name: wt
                      label: wtorku
                    - name: sr
                      label: środy
                    - name: czw
                      label: czwartku
                    - name: pt
                      label: piątku
          - name: wyjatki
            label: "Wyjątki: ręczny kolor jednego dnia (normalnie puste)"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{data} {kolor}"
            fields:
              - name: data
                label: Data
                type: date
                options:
                  format: yyyy-MM-dd
              - name: kolor
                label: Kolor
                type: select
                options:
                  values:
                    - name: niebieski
                      label: niebieski
                    - name: pomaranczowy
                      label: pomarańczowy
          - name: pdf
            label: Kalendarz PDF (opcjonalnie)
            type: file
            options:
              path: public/pliki/studia/kolory-dni
          - name: uwagi
            label: Uwaga nad kalendarzem (opcjonalnie)
            type: text
          - name: uwagi_en
            label: "EN: uwaga"
            type: text
  - name: katalog-pracownikow
    label: Katalog opiekunów (tylko odczyt)
    type: collection
    path: _cms/pracownicy
    format: yaml
    filename: "{primary}.yml"
    view:
      primary: imie_nazwisko
      fields:
        - imie_nazwisko
    description: Katalog wyboru z Web-Pracownicy; nie edytuj go ręcznie. Synchronizację wykonuje skrypt w Web-Core. Dane kontaktowe nie są kopiowane.
    fields:
      - name: imie_nazwisko
        label: Imię i nazwisko
        type: string
        readonly: true
      - name: id
        label: Stały identyfikator
        type: string
        readonly: true
    operations:
      create: false
      rename: false
      delete: false
