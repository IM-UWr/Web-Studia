        type: string
      - name: etykieta
        label: Podpis
        type: string
      - name: etykieta_krotka
        label: Krótszy podpis na telefon
        type: string
      - name: wartosc_en
        label: 'EN: wartość (puste = jak po polsku, np. liczby)'
        type: string
      - name: etykieta_en
        label: 'EN: podpis'
        type: string
      - name: etykieta_krotka_en
        label: 'EN: krótszy podpis na telefon'
        type: string
    - name: podtytul_en
      label: 'EN: nadtytuł'
      type: string
    - name: opis_en
      label: 'EN: zdanie pod nazwą'
      type: text
    - name: haslo_en
      label: 'EN: hasło'
      type: string
