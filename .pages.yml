# Pages CMS — formularze aktualnej strony Instytutu Matematycznego UWr.
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: strona-dzialu
  label: Strona działu Studia
  description: Tekst strony działu Studia, opis do wyszukiwarek, hasło i ramka W skrócie. Zestawienia powstają z
    pozostałych treści.
  type: file
  path: src/data/studia.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
    description: Nazwa strony lub wpisu, widoczna także na odpowiednich listach i w wynikach wyszukiwania.
  - name: status_publikacji
    label: Status publikacji
    type: select
    required: true
    default: oficjalna
    description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
    options:
      values:
      - name: oficjalna
        label: Opublikowana — strona oficjalna i podgląd
      - name: podglad
        label: Tylko podgląd
  - name: body
    label: Treść
    description: Tekst strony. Nagłówek 2 tworzy sekcję; listy z pogrubionym początkiem tworzą bloki cech lub etapów,
      a nagłówek 3 zakończony pytajnikiem — rozwijane pytanie.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/studia
  - name: tytul_en
    label: Tytuł EN
    type: string
    description: Angielska wersja pola Tytuł; puste oznacza użycie wersji polskiej.
  - name: tresc_en
    label: Treść EN
    type: rich-text
    options:
      format: markdown
      path: public/pliki/studia
    description: Tekst strony po angielsku; puste oznacza wyświetlanie tekstu polskiego. Układ treści jest taki
      sam jak w polskim opisie.
  - name: wstep
    label: Opis do wyszukiwarek
    type: text
    description: Opis strony do wyszukiwarek i udostępniania linków; nagłówek nowej strony nie pokazuje tego akapitu.
  - name: wstep_en
    label: Opis do wyszukiwarek EN
    type: text
    description: Angielska wersja pola Opis do wyszukiwarek; puste oznacza użycie wersji polskiej.
  - name: haslo
    label: Hasło w nagłówku
    type: string
    description: Krótkie hasło w nagłówku, widoczne razem z liczbami. Na okładce działu służy również jako podpis.
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
    description: Angielska wersja hasła; puste oznacza użycie wersji polskiej.
  - name: o_studiach_fakty
    label: Ramka „W skrócie” obok tekstu „O studiach” (komputer; puste = bez ramki; nie powtarzaj liczb z banera)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{wartosc} {opis}'
    fields:
    - name: wartosc
      label: Wartość (krótko, np. A+, PKA)
      type: string
      description: Krótka wartość, np. 6 semestrów lub A+.
    - name: wartosc_en
      label: 'EN: wartość (puste = jak po polsku, np. liczby i lata)'
      type: string
      description: Angielska wersja pola Wartość (krótko, np. A+, PKA); puste oznacza użycie wersji polskiej.
    - name: opis
      label: Opis pod wartością
      type: string
      description: Krótki opis używany na stronie lub w jej zapowiedzi.
    - name: opis_en
      label: 'EN: opis'
      type: string
      description: Angielska wersja pola Opis pod wartością; puste oznacza użycie wersji polskiej.
    description: Wartości i opisy w ramce W skrócie przy tekście o studiach.
- name: kierunki-grupa
  label: Kierunki
  description: Treść i banery kierunków. Menu oraz kafelki ustawisz w Web-Ustawienia → Menu główne.
  type: group
  items:
  - name: kierunki
    label: Treść
    description: Tekst strony kierunku lub szkoły doktorskiej. Dodanie wpisu nie dodaje pozycji do menu; menu i
      kafelki ustawisz w Web-Ustawienia → Menu główne.
    type: collection
    path: src/content/kierunki
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      fields:
      - nazwa
      - status_publikacji
      primary: nazwa
    fields:
    - name: nazwa
      label: Nazwa
      type: string
      required: true
      description: Nazwa wyświetlana na stronie i powiązanych listach.
    - name: status_publikacji
      label: Status publikacji
      type: select
      required: true
      default: oficjalna
      description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
      options:
        values:
        - name: oficjalna
          label: Opublikowana — strona oficjalna i podgląd
        - name: podglad
          label: Tylko podgląd
    - name: body
      label: Treść
      description: Tekst strony. Nagłówek 2 tworzy sekcję; listy z pogrubionym początkiem tworzą bloki cech lub
        etapów, a nagłówek 3 zakończony pytajnikiem — rozwijane pytanie.
      type: rich-text
      options:
        format: markdown
        path: public/pliki/studia
    - name: nazwa_en
      label: Nazwa EN
      type: string
      description: Angielska wersja pola Nazwa; puste oznacza użycie wersji polskiej.
    - name: tresc_en
      label: Treść EN
      description: Tekst strony po angielsku; puste oznacza wyświetlanie tekstu polskiego. Układ treści jest taki
        sam jak w polskim opisie.
      type: rich-text
      options:
        format: markdown
        path: public/pliki/studia
    - name: opublikowany
      label: Dotychczasowe uwzględnianie w zestawieniach
      type: boolean
      hidden: true
      default: true
      description: Zachowuje dotychczasową widoczność w zestawieniach i indeksowanie. To osobna opcja od statusu
        publikacji.
  - name: kierunki-baner
    label: Baner
    description: Opis, hasło i liczby strony kierunku. Nazwa pliku banera musi odpowiadać nazwie pliku kierunku.
      Polski poziom służy także do obliczania statystyk studiów.
    type: collection
    path: src/content/kierunki-baner
    format: json
    filename: '{fields.kierunek}.json'
    view:
      fields:
      - kierunek
      - podtytul
      primary: kierunek
    fields:
    - name: kierunek
      label: Kierunek (nazwa pliku treści, np. matematyka, isim, siad, szkola-doktorska)
      type: string
      required: true
      description: Nazwa pliku kierunku bez rozszerzenia, np. matematyka. Określa nazwę nowego pliku banera; nie
        zmieniaj jej przy istniejącym banerze.
    - name: podtytul
      label: Nadtytuł (np. Studia I i II stopnia)
      type: string
      description: Polski zapis poziomu, np. studia I i II stopnia. Używany do liczenia stopni studiów, a nie jako
        widoczny nadtytuł.
    - name: opis
      label: Zdanie pod nazwą
      type: text
      description: Opis strony do wyszukiwarek i udostępniania linku.
    - name: haslo
      label: Hasło w nagłówku
      type: string
      description: Krótkie hasło w nagłówku, widoczne razem z liczbami. Na okładce działu służy również jako podpis.
    - name: liczby
      label: Liczby (np. 3 lata — studia I stopnia)
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{wartosc} {etykieta}'
      fields:
      - name: wartosc
        label: Wartość
        type: string
        description: Krótka wartość, np. 6 semestrów lub A+.
      - name: etykieta
        label: Podpis
        type: string
        description: Napis wyświetlany przy tej pozycji.
      - name: wartosc_en
        label: 'EN: wartość (puste = jak po polsku, np. liczby)'
        type: string
        description: Angielska wersja pola Wartość; puste oznacza użycie wersji polskiej.
      - name: etykieta_en
        label: 'EN: podpis'
        type: string
        description: Angielska wersja pola Podpis; puste oznacza użycie wersji polskiej.
      description: Wartości i podpisy w nagłówku. Nie powtarzaj danych, które dana strona oblicza samodzielnie.
    - name: opis_en
      label: 'EN: zdanie pod nazwą'
      type: text
      description: Angielska wersja pola Zdanie pod nazwą; puste oznacza użycie wersji polskiej.
    - name: haslo_en
      label: 'EN: hasło'
      type: string
      description: Angielskie hasło; puste pole nie zastępuje go polskim hasłem.
- name: specjalnosci
  label: Specjalności
  type: collection
  path: src/content/specjalnosci
  format: yaml-frontmatter
  filename:
    template: '{primary}.md'
    field: create
  description: Jeden wpis zawiera tekst PL/EN, baner, kafelek i powiązania specjalności. Nazwa pliku ustala końcówkę
    adresu; nie zmieniaj nazw istniejących plików.
  view:
    fields:
    - nazwa
    - kierunek
    - status_publikacji
    - status_publikacji
    primary: nazwa
    sort:
    - kolejnosc
    default:
      sort: kolejnosc
      order: asc
  fields:
  - name: nazwa
    label: Nazwa
    type: string
    required: true
    description: Nazwa strony i kafelka. Nazwę pliku wybiera się przy tworzeniu; późniejsza zmiana nazwy nie zmienia
      adresu.
  - name: status_publikacji
    label: Status publikacji
    type: select
    required: true
    default: oficjalna
    description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
    options:
      values:
      - name: oficjalna
        label: Opublikowana — strona oficjalna i podgląd
      - name: podglad
        label: Tylko podgląd
  - name: kierunek
    label: Kierunek
    type: reference
    options:
      collection: kierunki
      value: '{path}'
      label: '{primary}'
      search: nazwa
    description: Kierunek, do którego należy ta specjalność; określa także pierwszą część jej adresu.
    required: true
    default: src/content/kierunki/matematyka.md
  - name: sposob_prezentacji
    label: Strona specjalności
    type: select
    required: true
    default: cms
    description: Na razie zapisuje wybór; strona nadal wyświetla treść z tego formularza.
    options:
      values:
      - name: cms
        label: Standardowa strona CMS
      - name: zewnetrzna
        label: Autorska strona zewnętrzna
  - name: adres_zewnetrzny
    label: Adres autorskiej strony
    type: string
    pattern:
      regex: ^(https?://[^\s]+)?$
      message: Wpisz pełny adres zaczynający się od https:// lub http://.
    description: Pełny adres, np. https://nazwa.github.io/. Na razie nie włącza przekierowania.
  - name: body
    label: Treść
    description: Tekst strony. Nagłówek 2 tworzy sekcję; listy z pogrubionym początkiem tworzą bloki cech lub etapów,
      a nagłówek 3 zakończony pytajnikiem — rozwijane pytanie. Seminaria i opiekunów strona wstawia z pól poniżej;
      ich miejsce można wskazać nagłówkami Seminaria i Opiekun specjalności.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/studia
  - name: nazwa_en
    label: Nazwa EN
    type: string
    description: Angielska wersja pola Nazwa; puste oznacza użycie wersji polskiej.
  - name: tresc_en
    label: Treść EN
    description: Tekst strony po angielsku; puste oznacza wyświetlanie tekstu polskiego. Układ treści jest taki
      sam jak w polskim opisie.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/studia
  - name: opis
    label: Jedno zdanie pod nazwą
    type: text
    description: Opis strony do wyszukiwarek i udostępniania linku. Pojawia się również w kafelku specjalności.
  - name: opis_en
    label: 'EN: zdanie pod nazwą'
    type: text
    description: Angielska wersja pola Jedno zdanie pod nazwą; puste oznacza użycie wersji polskiej.
  - name: haslo
    label: Hasło w nagłówku
    type: string
    description: Krótkie hasło w nagłówku, widoczne razem z liczbami. Na okładce działu służy również jako podpis.
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
    description: Angielskie hasło; puste pole nie zastępuje go polskim hasłem.
  - name: skrot
    label: Skrót (np. AD)
    type: string
    description: Krótki symbol widoczny w nagłówku i na kafelku, np. AD.
  - name: poziom
    label: Poziom (np. studia I i II stopnia)
    type: string
    description: Poziom studiów, np. studia I i II stopnia. Polski zapis służy także do wyliczenia liczby stopni.
  - name: poziom_en
    label: 'EN: poziom'
    type: string
    description: Angielska wersja pola Poziom (np. studia I i II stopnia); puste oznacza użycie wersji polskiej.
  - name: na_stronie_kierunku
    label: Pokaż kafelek na stronie kierunku
    type: boolean
    default: true
    description: Włącza kafelek specjalności na stronie wskazanego kierunku.
  - name: kolejnosc
    label: Kolejność kafelka na stronie kierunku (1 = pierwszy)
    type: number
    description: Mniejsza liczba oznacza wcześniejszą pozycję na liście.
  - name: kafelek_dla_kogo
    label: 'Kafelek: „Dla kogo” — jedno zdanie'
    type: text
    description: Jedno zdanie w polu Dla kogo na kafelku specjalności.
  - name: kafelek_dla_kogo_en
    label: 'EN: kafelek — dla kogo'
    type: text
    description: 'Angielska wersja pola Kafelek: „Dla kogo” — jedno zdanie; puste oznacza użycie wersji polskiej.'
  - name: kafelek_kariera
    label: 'Kafelek: „Po studiach” — jedno zdanie'
    type: text
    description: Jedno zdanie w polu Po studiach na kafelku specjalności.
  - name: kafelek_kariera_en
    label: 'EN: kafelek — po studiach'
    type: text
    description: 'Angielska wersja pola Kafelek: „Po studiach” — jedno zdanie; puste oznacza użycie wersji polskiej.'
  - name: zaklad
    label: Zakład
    type: select
    options:
      values:
      - name: algebra-i-teoria-modeli
        label: Zakład Algebry i Teorii Modeli
      - name: analiza-funkcjonalna
        label: Zakład Analizy Funkcjonalnej
      - name: analiza-matematyczna
        label: Zakład Analizy Matematycznej
      - name: dydaktyka
        label: Pracownia Dydaktyki i Popularyzacji Matematyki
      - name: geometria
        label: Zakład Geometrii
      - name: rownania-rozniczkowe
        label: Zakład Równań Różniczkowych
      - name: statystyka
        label: Zakład Statystyki
      - name: teoria-mnogosci-i-topologia
        label: Zakład Teorii Mnogości i Topologii
      - name: teoria-prawdopodobienstwa
        label: Zakład Teorii Prawdopodobieństwa
    description: Powiązanie ze stroną zakładu. Lista pochodzi z Web-Instytut; dodanie zakładu wymaga uzupełnienia
      listy wyboru.
  - name: opiekunowie
    label: Opiekunowie (imię i nazwisko jak w spisie pracowników, bez tytułów)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{imie_nazwisko}'
    fields:
    - name: imie_nazwisko
      label: Imię i nazwisko
      type: string
      description: Wpisz pełne imię i nazwisko. Służy także do łączenia danych tej osoby w innych działach.
    - name: rola
      label: Rola (opcjonalnie)
      type: string
      description: Funkcja tej osoby widoczna przy nazwisku.
    - name: rola_en
      label: 'EN: rola'
      type: string
      description: Angielska wersja pola Rola (opcjonalnie); puste oznacza użycie wersji polskiej.
    description: Imiona i nazwiska jak w spisie pracowników, bez tytułów. Kontakt i tytuł strona pobiera ze spisu.
  - name: seminaria
    label: Seminaria związane ze specjalnością
    type: select
    options:
      values:
      - name: analiza-harmoniczna
        label: Analiza harmoniczna i rozwinięcia ortogonalne
      - name: dydaktyka
        label: Seminarium Pracowni Dydaktyki i Popularyzacji Matematyki
      - name: dyskretna-analiza-harmoniczna
        label: Dyskretna analiza harmoniczna i niekomutatywna probabilistyka
      - name: geometria
        label: Geometria
      - name: prawdopodobienstwo
        label: Teoria prawdopodobieństwa i modelowanie stochastyczne
      - name: rownania-rozniczkowe
        label: Równania różniczkowe
      - name: statystyka
        label: Statystyka
      - name: teoria-modeli
        label: Teoria modeli
      - name: topologia
        label: Topologia
      multiple: true
    description: Seminaria wymienione na stronie specjalności, w kolejności wyboru. Lista pochodzi z repozytoriów
      seminariów.
  - name: wygaszana
    label: Wygaszana
    type: boolean
    description: Dodaje oznaczenie wygaszanej specjalności i umieszcza jej kafelek za pozostałymi.
  - name: bez_podstrony
    label: Bez własnej podstrony (tylko kafelek, np. specjalność wygaszana)
    type: boolean
    default: false
    description: Wyłącza generowanie własnej podstrony; pozostaje możliwość pokazania kafelka. Nie jest to wybór
      strony zewnętrznej.
  - name: opublikowany
    label: Dotychczasowe uwzględnianie w zestawieniach
    type: boolean
    hidden: true
    default: true
    description: Zachowuje dotychczasową widoczność w zestawieniach i indeksowanie. To osobna opcja od statusu publikacji.
- name: przypomnienia
  label: Przypomnienia o terminach
  description: Terminy pokazywane z wyprzedzeniem w nadchodzących wydarzeniach oraz kalendarzu. Link prowadzi np.
    do formularza lub strony kierunku.
  type: file
  path: src/data/przypomnienia.json
  format: json
  fields:
  - name: przypomnienia
    label: Przypomnienia
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{data} {sprawa}'
    fields:
    - name: sprawa
      label: Sprawa (np. Deklaracja specjalności (I stopień))
      type: string
      required: true
      description: Nazwa terminu wyświetlana w zapowiedzi.
    - name: status_publikacji
      label: Status publikacji
      type: select
      required: true
      default: oficjalna
      description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
      options:
        values:
        - name: oficjalna
          label: Opublikowana — strona oficjalna i podgląd
        - name: podglad
          label: Tylko podgląd
    - name: podpis
      label: Podpis pod sprawą (np. 4. semestr studiów I stopnia · formularz C2)
      type: string
      description: Dodatkowy podpis pod nazwą wydarzenia.
    - name: data
      label: Data
      type: date
      required: true
      options:
        format: yyyy-MM-dd
      description: Data wpisu używana do sortowania i wyświetlana przy aktualności.
    - name: co_roku
      label: Co roku (rok w dacie nie ma znaczenia)
      type: boolean
      default: true
      description: Powtarza termin w tym samym dniu i miesiącu; rok w polu daty nie ogranicza powtórzeń.
    - name: dni_przed
      label: Ile dni wcześniej pokazać
      type: number
      default: 14
      description: Ile dni kalendarzowych wcześniej pokazać przypomnienie.
    - name: adres
      label: Link (np. /studia/matematyka#terminy)
      type: string
      description: Adres naszej strony zaczyna się od /; zewnętrzny od https://.
    - name: sprawa_en
      label: 'EN: sprawa'
      type: string
      description: Angielska wersja pola Sprawa (np. Deklaracja specjalności (I stopień)); puste oznacza użycie
        wersji polskiej.
    - name: podpis_en
      label: 'EN: podpis'
      type: string
      description: Angielska wersja pola Podpis pod sprawą (np. 4. semestr studiów I stopnia · formularz C2); puste
        oznacza użycie wersji polskiej.
    - name: uid
      label: Identyfikator w kalendarzach (techniczne, nie zmieniać)
      type: string
      hidden: true
      description: Stałe oznaczenie wpisu w kalendarzu. Nie zmieniaj istniejących wartości, aby nie tworzyć duplikatów.
    description: Terminy pokazywane z wyprzedzeniem w nadchodzących wydarzeniach i kalendarzu.
- name: strony
  label: Strony studiów
  description: Strony informacyjne oraz teksty stron z listami. Adres wynika ze ścieżki pliku; nie zmieniaj nazw
    istniejących plików. Nowe strony nie są dopisywane do menu.
  type: collection
  path: src/content/strony/studia
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    - status_publikacji
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
    description: Nazwa strony lub wpisu, widoczna także na odpowiednich listach i w wynikach wyszukiwania.
  - name: status_publikacji
    label: Status publikacji
